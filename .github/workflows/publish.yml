name: Publish
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing requires npm >= 11.5
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
      - run: npm run build
      - run: npm test
      - run: npm stage publish
  # Separate job so it can be re-run on its own if JSR publishing fails
  jsr:
    needs: npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: jq --arg v "${GITHUB_REF_NAME#v}" '.version = $v' jsr.json > jsr.tmp && mv jsr.tmp jsr.json
      - run: npx jsr publish --allow-dirty
